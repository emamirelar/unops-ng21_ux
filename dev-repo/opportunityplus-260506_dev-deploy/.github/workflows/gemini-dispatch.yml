name: 'Gemini AI Assistant'

on:
  # Trigger on regular PR/issue comments (e.g., @gemini-cli /review)
  # This is the most common way users will invoke commands
  issue_comment:
    types:
      - 'created'

  # Trigger on PR review comments (comments on specific lines of code)
  pull_request_review_comment:
    types:
      - 'created'

  # Trigger on PR reviews (when a full review is submitted)
  pull_request_review:
    types:
      - 'submitted'

  # Trigger on new PRs for automatic review
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
jobs:
  gemini:
    # Call the reusable workflow from the organization's .github repository
    uses: 'UNOPS-ITG/.github/.github/workflows/gemini-dispatch.yaml@main'

    # Grant the necessary permissions to the called workflow
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'

    # Pass secrets to the called workflow
    secrets: 'inherit'
