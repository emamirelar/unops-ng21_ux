metadata:
  name: "entity-user-roles-doa"
  description: "Delegation of Authority (DoA) roles sync - all types (Engagement Acceptance, HR, Finance, Procurement, Procurement ICA); OiC from Delegation_Of_Authorities_Report"
  version: "1.5"
  enabled: true
  max_retry_attempts: 1
  timeout_minutes: 15  # Increased: FK lookups per record can be slow

source:
  type: "bigquery"
  
  query: |
    -- CRITICAL: Only include Org_Units that exist in organization-hierarchies sync (avoids EntityId FK lookup failures)
    WITH ORG AS (
      SELECT * FROM `unopsreporting.Organisation.Organisational_Structures`
      WHERE CAST(Effective_Date AS DATE) = CURRENT_DATE()
    )
    , VALID_ORG_UNITS AS (
      -- Mirror organization-hierarchies.yaml ORG_UNIT logic - only org units that sync to OrganizationHierarchies
      SELECT DISTINCT Org_Unit AS Code
      FROM ORG
      WHERE Org_Unit > ''
        AND (Hub > '' OR Region > '')
    )
    -- People_Search Org_Unit_Work_At is the org code only; append Org_Unit_Description from ORG when present
    , PEOPLE_WORK_AT AS (
      SELECT
        CAST(PARSE_NUMERIC(ps.Resource) AS INT64) AS ResourceNum
        , IF(
            NULLIF(TRIM(ps.Org_Unit_Work_At), '') IS NOT NULL
              AND NULLIF(TRIM(o.Org_Unit_Description), '') IS NOT NULL,
            CONCAT(TRIM(ps.Org_Unit_Work_At), ', ', TRIM(o.Org_Unit_Description)),
            COALESCE(
              NULLIF(TRIM(ps.Org_Unit_Work_At), ''),
              NULLIF(TRIM(o.Org_Unit_Description), '')
            )
          ) AS Org_Unit_Work_At
      FROM `unopsreporting.Employment.People_Search_Report` ps
      LEFT JOIN ORG o ON TRIM(o.Org_Unit) = TRIM(ps.Org_Unit_Work_At)
      WHERE ps.Effective_Date = CURRENT_DATE()
        AND ps.Employment_Status = 'N'
        AND ps.Employment_Type IN ('OPSSTAFF', 'OPSNONSTAFF', 'EXTAFFILIATE')
        AND UPPER(ps.Resource_Email_Address_Primary) LIKE '%UNOPS.ORG'
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY CAST(PARSE_NUMERIC(ps.Resource) AS INT64)
        ORDER BY ps.Resource_Email_Address_Primary
      ) = 1
    )
    , DOA_DATA AS (
      SELECT
        -- Generate unique ID for composite key (EntityId, EntityRoleId, UserId)
        -- Include DoA type in hash so same user can have multiple DoA roles per org unit
        CAST(MOD(ABS(FARM_FINGERPRINT(CONCAT(
          CAST(d.Org_Unit AS STRING),
          '-',
          COALESCE(d.Delegation_Of_Authority_Description, ''),
          '-',
          d.Delegation_Of_Authority_Level,
          '-',
          d.Resource
        ))), 2147483647) AS INT64) AS Id
        
        -- Map Org_Unit to OrganizationHierarchy EntityId using hash
        , CAST(MOD(ABS(FARM_FINGERPRINT(d.Org_Unit)), 2147483647) AS INT64) AS EntityId
        , 'OrganizationHierarchy' AS EntityType
        
        -- Map UserId from Resource (employee ID) - ensure it's INT64
        , CAST(PARSE_NUMERIC(d.Resource) AS INT64) AS UserId
        
        -- Map (Delegation_Of_Authority_Description, Delegation_Of_Authority_Level) to EntityRoleCode
        , CASE
            WHEN d.Delegation_Of_Authority_Description = 'Human Resources' AND d.Delegation_Of_Authority_Level = '0' THEN 'DoA0_HR'
            WHEN d.Delegation_Of_Authority_Description = 'Human Resources' AND d.Delegation_Of_Authority_Level = '1' THEN 'DoA1_HR'
            WHEN d.Delegation_Of_Authority_Description = 'Human Resources' AND d.Delegation_Of_Authority_Level = '2' THEN 'DoA2_HR'
            WHEN d.Delegation_Of_Authority_Description = 'Human Resources' AND d.Delegation_Of_Authority_Level = '3' THEN 'DoA3_HR'
            WHEN d.Delegation_Of_Authority_Description = 'Human Resources' AND d.Delegation_Of_Authority_Level = '4' THEN 'DoA4_HR'
            WHEN d.Delegation_Of_Authority_Description = 'Finance' AND d.Delegation_Of_Authority_Level = '1' THEN 'DoA1_Finance'
            WHEN d.Delegation_Of_Authority_Description = 'Finance' AND d.Delegation_Of_Authority_Level = '2' THEN 'DoA2_Finance'
            WHEN d.Delegation_Of_Authority_Description = 'Finance' AND d.Delegation_Of_Authority_Level = '3' THEN 'DoA3_Finance'
            WHEN d.Delegation_Of_Authority_Description = 'Finance' AND d.Delegation_Of_Authority_Level = '4' THEN 'DoA4_Finance'
            WHEN d.Delegation_Of_Authority_Description = 'Finance' AND d.Delegation_Of_Authority_Level = 'F' THEN 'DoAF_Finance'
            WHEN d.Delegation_Of_Authority_Description = 'Procurement' AND d.Delegation_Of_Authority_Level = '1' THEN 'DoA1_Procurement'
            WHEN d.Delegation_Of_Authority_Description = 'Procurement' AND d.Delegation_Of_Authority_Level = '2' THEN 'DoA2_Procurement'
            WHEN d.Delegation_Of_Authority_Description = 'Procurement' AND d.Delegation_Of_Authority_Level = '3' THEN 'DoA3_Procurement'
            WHEN d.Delegation_Of_Authority_Description = 'Procurement' AND d.Delegation_Of_Authority_Level = '4' THEN 'DoA4_Procurement'
            WHEN d.Delegation_Of_Authority_Description = 'Procurement - ICA' AND d.Delegation_Of_Authority_Level = '1' THEN 'DoA1_Procurement_ICA'
            WHEN d.Delegation_Of_Authority_Description = 'Procurement - ICA' AND d.Delegation_Of_Authority_Level = '2' THEN 'DoA2_Procurement_ICA'
            WHEN d.Delegation_Of_Authority_Description = 'Procurement - ICA' AND d.Delegation_Of_Authority_Level = '3' THEN 'DoA3_Procurement_ICA'
            WHEN d.Delegation_Of_Authority_Description = 'Procurement - ICA' AND d.Delegation_Of_Authority_Level = '4' THEN 'DoA4_Procurement_ICA'
            WHEN d.Delegation_Of_Authority_Description = 'Procurement - ICA' AND d.Delegation_Of_Authority_Level = '5' THEN 'DoA5_Procurement_ICA'
            WHEN d.Delegation_Of_Authority_Description = 'Engagement Acceptance' AND d.Delegation_Of_Authority_Level = '1' THEN 'DoA1_Engagement_Acceptance'
            WHEN d.Delegation_Of_Authority_Description = 'Engagement Acceptance' AND d.Delegation_Of_Authority_Level = '2' THEN 'DoA2_Engagement_Acceptance'
            WHEN d.Delegation_Of_Authority_Description = 'Engagement Acceptance' AND d.Delegation_Of_Authority_Level = '3' THEN 'DoA3_Engagement_Acceptance'
            WHEN d.Delegation_Of_Authority_Description = 'Engagement Acceptance' AND d.Delegation_Of_Authority_Level = '4' THEN 'DoA4_Engagement_Acceptance'
            ELSE NULL
          END AS EntityRoleCode
        
        -- Standard fields (include DoA type in Name for clarity)
        , CONCAT(
            COALESCE(d.Delegation_Of_Authority_Description, 'DoA'), ' DoA', d.Delegation_Of_Authority_Level,
            ' - ', d.Org_Unit,
            ' - ', d.Resource,
            ' (', d.Resource_Name, ')'
          ) AS Name
        , CAST(1 AS INT64) AS Status  -- Active
        , CAST(0 AS INT64) AS CreatedBy
        , CURRENT_TIMESTAMP() AS CreatedDate
        , CAST(0 AS INT64) AS LastModifiedBy
        , CURRENT_TIMESTAMP() AS LastModifiedDate  -- Always update to track sync time
        , FALSE AS IsDeleted
        , CAST(0 AS INT64) AS DeletedBy
        , CAST(NULL AS TIMESTAMP) AS DeletedDate
        , CAST(0 AS INT64) AS WorkflowStatus
        , CAST(FALSE AS BOOL) AS IsManualAssignment  -- EDS-managed rows; UI assignments set true in app DB
        
        -- PositionTitle: use Standardized when available, else Position_Description (BQ sample shows Standardized can be empty)
        , COALESCE(NULLIF(TRIM(d.Standardized_Position_Title_Description), ''), d.Position_Description) AS PositionTitle
        -- OrgUnitWorksAt: People Search Org_Unit_Work_At (aligned with UserProfile.OrgUnit), fallback to DoA org label
        , COALESCE(NULLIF(TRIM(p.Org_Unit_Work_At), ''), CONCAT(d.Org_Unit, ', ', COALESCE(d.Org_Unit_Description, ''))) AS OrgUnitWorksAt
        -- Additional context fields for debugging
        , d.Org_Unit AS OrgUnitCode
        , d.Org_Unit_Description
        , d.Region
        , d.Region_Description
        , d.Hub
        , d.Hub_Description
        , d.Resource
        , d.Resource_Name
        , d.Position_Description
        , d.Standardized_Position_Title_Description
        , NULLIF(TRIM(d.Officer_In_Charge_Resource), '') AS Officer_In_Charge_Resource
        , d.Delegation_Of_Authority_Level AS DoALevel
        , d.Delegation_Of_Authority_Description
        , d.Delegation_Of_Authority_Start_Date
        , d.Delegation_Of_Authority_End_Date
        , d.Delegation_Of_Authority_Entry_Status
        , d.Delegation_Of_Authority_Entry_Status_Description
        , d.Last_Updated
        , d.Last_Updated_User
        , d.Last_Updated_User_Name
        
      FROM
        `unopsreporting.Common.Delegation_Of_Authorities_Report` d
      LEFT JOIN PEOPLE_WORK_AT p ON CAST(PARSE_NUMERIC(d.Resource) AS INT64) = p.ResourceNum
      WHERE
        d.Delegation_Of_Authority_Entry_Status = 'N'  -- Active entries only (N = Normal/Active)
        -- Check that current date is within the delegation period
        AND CAST(d.Delegation_Of_Authority_Start_Date AS DATE) <= CURRENT_DATE()
        AND (
          d.Delegation_Of_Authority_End_Date IS NULL  -- No end date = ongoing
          OR CAST(d.Delegation_Of_Authority_End_Date AS DATE) >= CURRENT_DATE()
        )
        AND d.Org_Unit IS NOT NULL
        AND d.Resource IS NOT NULL
        AND d.Delegation_Of_Authority_Level IS NOT NULL
    )
    
    -- Filter to only org units that exist in OrganizationHierarchies (avoids EntityId FK lookup failures)
    -- Exclude unmapped DoA type/level combinations (EntityRoleCode IS NULL)
    , DOA_DATA_FILTERED AS (
      SELECT d.*
      FROM DOA_DATA d
      INNER JOIN VALID_ORG_UNITS v ON v.Code = d.OrgUnitCode
      WHERE d.EntityRoleCode IS NOT NULL
    )
    
    SELECT
      Id
      , EntityId
      , EntityType
      , UserId
      , EntityRoleCode
      , Name
      , Status
      , 'DoA' AS RoleSource
      , CreatedBy
      , CreatedDate
      , LastModifiedBy
      , LastModifiedDate
      , IsDeleted
      , DeletedBy
      , DeletedDate
      , WorkflowStatus
      , IsManualAssignment
      , OrgUnitCode
      , Org_Unit_Description
      , Region
      , Region_Description
      , Hub
      , Hub_Description
      , Resource
      , Resource_Name
      , PositionTitle
      , OrgUnitWorksAt
      , Position_Description
      , Standardized_Position_Title_Description
      , Officer_In_Charge_Resource
      , DoALevel
      , Delegation_Of_Authority_Description
      , Delegation_Of_Authority_Start_Date
      , Delegation_Of_Authority_End_Date
      , Delegation_Of_Authority_Entry_Status
      , Delegation_Of_Authority_Entry_Status_Description
      , Last_Updated
      , Last_Updated_User
      , Last_Updated_User_Name
    FROM DOA_DATA_FILTERED;
  
  primary_key_field: "Id"
  batch_size: 2000  # Fewer batches = less round-trip overhead for ~2k records

  # Orphan soft-delete only for EDS-backed DoA rows (not UI test assignments: IsManualAssignment = true)
  filter:
    and:
      - field: "RoleSource"
        value: "DoA"
      - field: "IsManualAssignment"
        value: false

destination:
  table_name: "EntityUserRoles"
  schema: "public"
  # Schema owned by EF migrations; EDS validates columns exist then syncs data only.
  manage_table_structure: false
  add_standard_fields: false  # Table already has standard fields, don't add new ones

  field_mappings:
    # Primary Key (generated from composite key hash)
    - source_field: "Id"
      destination_field: "Id"
      data_type: "integer"
      is_required: true
    
    # UserId - handled via foreign_key_mappings (validates & maps)
    # EntityId - foreign key (will be validated via foreign_key_mappings)
    - source_field: "EntityId"
      destination_field: "EntityId"
      data_type: "integer"
      is_required: true
    
    # EntityRoleId will be resolved via foreign_key_mappings (not mapped here)
    
    - source_field: "EntityType"
      destination_field: "EntityType"
      data_type: "text"
      is_required: true
    
    # Standard ModifiableDeletableEntity fields
    - source_field: "Name"
      destination_field: "Name"
      data_type: "text"
      is_required: false
    
    - source_field: "Status"
      destination_field: "Status"
      data_type: "integer"
      is_required: true
    
    - source_field: "CreatedBy"
      destination_field: "CreatedBy"
      data_type: "integer"
      is_required: true
      insert_only: true  # Preserve original creator, don't update
    
    - source_field: "CreatedDate"
      destination_field: "CreatedDate"
      data_type: "timestamp"
      is_required: true
      insert_only: true  # Preserve original creation time, don't update
    
    - source_field: "LastModifiedBy"
      destination_field: "LastModifiedBy"
      data_type: "integer"
      is_required: true
    
    - source_field: "LastModifiedDate"
      destination_field: "LastModifiedDate"
      data_type: "timestamp"
      is_required: true
    
    - source_field: "IsDeleted"
      destination_field: "IsDeleted"
      data_type: "boolean"
      is_required: true
    
    - source_field: "DeletedBy"
      destination_field: "DeletedBy"
      data_type: "integer"
      is_required: false
    
    - source_field: "DeletedDate"
      destination_field: "DeletedDate"
      data_type: "timestamp"
      is_required: false
    
    - source_field: "WorkflowStatus"
      destination_field: "WorkflowStatus"
      data_type: "integer"
      is_required: true
    
    - source_field: "RoleSource"
      destination_field: "RoleSource"
      data_type: "varchar(50)"
      is_required: true

    - source_field: "IsManualAssignment"
      destination_field: "IsManualAssignment"
      data_type: "boolean"
      is_required: true
      insert_only: true  # Never overwrite UI-assigned true on sync updates
    
    # DoA applicability period (from BigQuery Delegation_Of_Authority dates)
    - source_field: "Delegation_Of_Authority_Start_Date"
      destination_field: "ApplicabilityPeriodStart"
      data_type: "timestamp"
      is_required: false
    
    - source_field: "Delegation_Of_Authority_End_Date"
      destination_field: "ApplicabilityPeriodEnd"
      data_type: "timestamp"
      is_required: false
    
    # PositionTitle: COALESCE(Standardized_Position_Title_Description, Position_Description) from BQ
    - source_field: "PositionTitle"
      destination_field: "PositionTitle"
      data_type: "varchar(255)"
      is_required: false
    
    # OrgUnitWorksAt: org unit code and description for display
    - source_field: "OrgUnitWorksAt"
      destination_field: "OrgUnitWorksAt"
      data_type: "varchar(255)"
      is_required: false
    
    # DoA type (e.g., Engagement Acceptance, Finance, HR, Procurement)
    - source_field: "Delegation_Of_Authority_Description"
      destination_field: "DoAType"
      data_type: "varchar(100)"
      is_required: false
    
    # Officer-in-Charge (OiC) resource ID - from Delegation_Of_Authorities_Report
    - source_field: "Officer_In_Charge_Resource"
      destination_field: "OfficerInChargeResourceId"
      data_type: "varchar(50)"
      is_required: false
  
  # Mark orphaned DoA records (in DB but not in BigQuery) as IsDeleted=true
  delete_handler:
    field: "IsDeleted"
    value: true

  # Foreign key lookups - resolves IDs from lookup tables
  foreign_key_mappings:
    # Lookup EntityRoleId from EntityRoles using EntityRoleCode
    # This transforms EntityRoleCode (text) into EntityRoleId (integer)
    - source_field: "EntityRoleCode"
      lookup_table: "EntityRoles"
      lookup_field: "Code"
      destination_field: "EntityRoleId"
      lookup_return_field: "Id"
      is_required: true
      on_lookup_fail: "LogWarning"
    
    # Validate UserId exists in AspNetUsers - skip record if user is missing
    - source_field: "UserId"
      lookup_table: "AspNetUsers"
      lookup_field: "Id"
      destination_field: "UserId"
      lookup_return_field: "Id"
      is_required: false
      on_lookup_fail: "LogWarning"

sync_options:
  sync_mode: Upsert  # Insert new or update ALL existing records
  batch_processing: true
  use_bulk_upsert: true  # Uses Id (PK); no additional index needed
  delete_orphaned_records: true  # Mark DoA records not in BigQuery as IsDeleted=true
  # Note: Updates all records on every sync to ensure latest data
  # Use CreatedDate vs LastModifiedDate to distinguish inserts from updates
  # Upsert matching: Uses primary_key_field "Id" defined in source section

validation:
  required_source_fields:
    - "Id"
    - "EntityId"
    - "EntityType"
    - "UserId"
    - "EntityRoleCode"
  
  # Validate DoA levels (STRING values) - 0,1,2,3,4,5,F per BigQuery source
  custom_validations:
    - field: "DoALevel"
      rule: "in_list"
      allowed_values: ["0", "1", "2", "3", "4", "5", "F"]
      error_message: "DoA Level must be 0, 1, 2, 3, 4, 5, or F"
  
error_handling:
  on_connection_error: RetryWithBackoff
  on_mapping_error: SkipRecord
  on_lookup_failure: SkipRecord
  log_skipped_records: true

logging:
  log_level: "Debug"
  log_sql_queries: true
  log_record_details: false  # Disable to reduce I/O; enable only for troubleshooting
  log_lookup_failures: true

notes: |
  This sync configuration manages Delegation of Authority (DoA) roles for ALL DoA types, plus OiC (Officers-in-Charge).
  
  Data sources:
  - DoA holders: unopsreporting.Common.Delegation_Of_Authorities_Report
  - OiC: unops-fabric.erp (aunopsrmassign, aunopsrmbusrole, agldimvalue, aunopsrmbussubrole) - inline query, no view dependency
  
  DoA Type → EntityRoleCode mapping (in BigQuery query):
  - Human Resources: DoA0_HR, DoA1_HR, DoA2_HR, DoA3_HR, DoA4_HR
  - Finance: DoA1_Finance, DoA2_Finance, DoA3_Finance, DoA4_Finance, DoAF_Finance
  - Procurement: DoA1_Procurement, DoA2_Procurement, DoA3_Procurement, DoA4_Procurement
  - Procurement - ICA: DoA1_Procurement_ICA ... DoA5_Procurement_ICA
  - Engagement Acceptance: DoA1_Engagement_Acceptance ... DoA4_Engagement_Acceptance
  
  OiC EntityRoleCode mapping (from unops-fabric.erp):
  - Engagement Acceptance: DoA1-4_Engagement_Acceptance_OiC
  - Finance: DoA1-4_Finance_OiC, DoAF_Finance_OiC
  - Grants: DoA1-5_Grants_OiC
  - HR: DoA0-4_HR_OiC
  - Partnerships: DoA3_Partnerships_OiC
  - Procurement: DoA1-4_Procurement_OiC
  - Procurement ICA: DoA1-5_Procurement_ICA_OiC
  - OiC Org_Unit: from People_Search_Report.Org_Unit_Work_At for authority holder (assiba.bus_acc_id).
  
  Key Features:
  - Syncs only active DoA assignments (Entry_Status = 'N' = Normal/Active)
  - Syncs ALL DoA types (Engagement Acceptance, HR, Finance, Procurement, Procurement ICA)
  - Mapping done in BigQuery query - no app-side registry needed
  - Filters by date range:
    * Current date >= Delegation_Of_Authority_Start_Date
    * Current date <= Delegation_Of_Authority_End_Date (or End_Date is NULL for ongoing)
  - Updates all records on every sync run (like engagements.yaml):
    * Table DDL is from EF migrations; manage_table_structure: false — EDS upserts data only
    * LastModifiedDate is always set to CURRENT_TIMESTAMP() on every sync
    * CreatedDate is preserved from first insert (insert_only: true)
    * To identify which records were just inserted vs updated:
      - New inserts: CreatedDate ≈ LastModifiedDate (within seconds)
      - Updates: CreatedDate < LastModifiedDate (older creation date)
  - Uses foreign_key_mappings to resolve:
    * EntityRoleCode (text) → EntityRoles.Id (EntityRoleId as integer)
  - UserId and EntityId are already integers from BigQuery, mapped directly
  - Records will be skipped if EntityRoleCode lookup fails
  
  Source Data Fields:
  - Delegation_Of_Authority_Description: Human Resources, Finance, Procurement, Procurement - ICA, Engagement Acceptance
  - Delegation_Of_Authority_Level: STRING values '0', '1', '2', '3', '4', '5', or 'F'
  - Resource: Employee ID (numeric string)
  - Org_Unit: Organization unit code
  - Delegation_Of_Authority_Start_Date: When delegation begins (mapped to ApplicabilityPeriodStart)
  - Delegation_Of_Authority_End_Date: When delegation ends (NULL = ongoing) (mapped to ApplicabilityPeriodEnd)
  - Delegation_Of_Authority_Entry_Status: 'N' = Active, other values = Inactive
  - Conditions: If present in BigQuery source, add mapping to EntityUserRoles.Conditions
  
  Prerequisites:
  - PAOUsers table must contain the Resource IDs from BigQuery (as UserId)
  - OrganizationHierarchies table must contain records with matching FARM_FINGERPRINT hashes
  - EntityRoles must have all DoA + OiC roles seeded (EntityRoleSeeder.SeedDoATypeRolesAsync + SeedDoATypeRolesAsync OiC):
    * DoA: Engagement Acceptance, HR, Finance, Procurement, Procurement ICA (all levels)
    * OiC: DoA1-4_Engagement_Acceptance_OiC, DoA1-4_Finance_OiC, DoAF_Finance_OiC, DoA1-5_Grants_OiC,
      DoA0-4_HR_OiC, DoA3_Partnerships_OiC, DoA1-4_Procurement_OiC, DoA1-5_Procurement_ICA_OiC
  
  Troubleshooting:
  - If sync is slow: check "4 unresolved errors" in EDS UI - may indicate many lookup failures
  - If still slow: try delete_orphaned_records: false temporarily (orphan scan can be slow on large tables)
  - Ensure EntityRoles.Code and AspNetUsers.Id are indexed for fast lookups
  - If records are skipped, check logs for EntityRoleCode lookup failures
  - Verify EntityRoles DoA1-4 exist with correct codes:
    * SELECT "Id", "Code", "EntityType", "IsDeleted" FROM "EntityRoles" WHERE "EntityType" = 'OrganizationHierarchy'
    * Expected: DoA1_Engagement_Acceptance, DoA2_Engagement_Acceptance, DoA3_Engagement_Acceptance, DoA4_Engagement_Acceptance
  - EntityRoleCode lookup uses exact match on Code field (case-sensitive)
  - UserId values come directly from BigQuery (Resource field cast to INT64)
  - EntityId values are generated via FARM_FINGERPRINT hash of Org_Unit code
  - If foreign key constraint errors occur, verify PAOUsers and OrganizationHierarchies contain the expected IDs
  - To identify inserts vs updates after sync:
    * Recently inserted: SELECT "Id", "Name", "CreatedDate", "LastModifiedDate" 
                         FROM "EntityUserRoles" 
                         WHERE "EntityType" = 'OrganizationHierarchy' 
                         AND "CreatedDate" >= NOW() - INTERVAL '5 minutes'
                         ORDER BY "CreatedDate" DESC;
    * Recently updated:  SELECT "Id", "Name", "CreatedDate", "LastModifiedDate" 
                         FROM "EntityUserRoles" 
                         WHERE "EntityType" = 'OrganizationHierarchy' 
                         AND "LastModifiedDate" >= NOW() - INTERVAL '5 minutes'
                         AND "CreatedDate" < "LastModifiedDate" - INTERVAL '1 minute'
                         ORDER BY "LastModifiedDate" DESC;
