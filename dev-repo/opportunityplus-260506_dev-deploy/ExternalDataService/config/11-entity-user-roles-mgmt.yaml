metadata:
  name: "entity-user-roles-mgmt"
  description: "Organization Management roles sync (Directors, Deputies, HoSS, HSSE Regional Specialist/OiC). HSSE Coordinator and Head of Programme come from OfficeMaster / other paths — not this sync."
  version: "1.8"
  enabled: true
  max_retry_attempts: 1
  timeout_minutes: 5

source:
  type: "bigquery"
  
  query: |
    -- This query unpivots the Organisational_Structures table to create one row per director/deputy assignment
    -- Each row represents a (UserId, EntityId, EntityRoleCode) combination
    -- CRITICAL: Only include Org_Units that exist in organization-hierarchies sync (avoids FK lookup failures)
    WITH ORG AS (
      SELECT * FROM `unopsreporting.Organisation.Organisational_Structures`
      WHERE CAST(Effective_Date AS DATE) = CURRENT_DATE()
    )
    , VALID_ORG_UNITS AS (
      -- Mirror organization-hierarchies.yaml ORG_UNIT logic - only org units that sync to OrganizationHierarchies
      SELECT DISTINCT Org_Unit AS Code
      FROM ORG
      WHERE Org_Unit > ''
        AND (Hub > '' OR Region > '')
    )
    -- People_Search: Org_Unit_Work_At (code + description) and Position_Description for PositionTitle (02-userprofile uses same field as Position)
    , PEOPLE_WORK_AT AS (
      SELECT
        CAST(PARSE_NUMERIC(ps.Resource) AS INT64) AS ResourceNum
        , IF(
            NULLIF(TRIM(ps.Org_Unit_Work_At), '') IS NOT NULL
              AND NULLIF(TRIM(o.Org_Unit_Description), '') IS NOT NULL,
            CONCAT(TRIM(ps.Org_Unit_Work_At), ', ', TRIM(o.Org_Unit_Description)),
            COALESCE(
              NULLIF(TRIM(ps.Org_Unit_Work_At), ''),
              NULLIF(TRIM(o.Org_Unit_Description), '')
            )
          ) AS Org_Unit_Work_At
        , NULLIF(TRIM(CAST(ps.Position_Description AS STRING)), '') AS PeopleSearch_PositionDescription
      FROM `unopsreporting.Employment.People_Search_Report` ps
      LEFT JOIN ORG o ON TRIM(o.Org_Unit) = TRIM(ps.Org_Unit_Work_At)
      WHERE ps.Effective_Date = CURRENT_DATE()
        AND ps.Employment_Status = 'N'
        AND ps.Employment_Type IN ('OPSSTAFF', 'OPSNONSTAFF', 'EXTAFFILIATE')
        AND UPPER(ps.Resource_Email_Address_Primary) LIKE '%UNOPS.ORG'
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY CAST(PARSE_NUMERIC(ps.Resource) AS INT64)
        ORDER BY ps.Resource_Email_Address_Primary
      ) = 1
    )
    , ORG_STRUCTURE AS (
      SELECT
        Org_Unit
        , Org_Unit_Description
        , Hub
        , Hub_Description
        , Region
        , Region_Description
        , System_Status
        , Effective_Date
        -- Region level roles
        , Region_Director_Resource
        , Region_Director_Resource_Name
        , Region_Director_Position_No
        , Region_Director_Position_Description
        , Region_Deputy_Director_Resource
        , Region_Deputy_Director_Resource_Name
        , Region_Deputy_Director_Position_No
        , Region_Deputy_Director_Position_Description
        -- Hub level roles (MCO = Multi-Country Office = Hub)
        , Hub_Director_Resource
        , Hub_Director_Resource_Name
        , Hub_Director_Position_No
        , Hub_Director_Position_Description
        , Hub_Deputy_Director_Resource
        , Hub_Deputy_Director_Resource_Name
        , Hub_Deputy_Director_Position_No
        , Hub_Deputy_Director_Position_Description
        -- OrgUnit level roles
        , Org_Unit_Director_Resource
        , Org_Unit_Director_Resource_Name
        , Org_Unit_Director_Position_No
        , Org_Unit_Director_Position_Description
        , Org_Unit_Deputy_Director_Resource
        , Org_Unit_Deputy_Director_Resource_Name
        , Org_Unit_Deputy_Director_Position_No
        , Org_Unit_Deputy_Director_Position_Description
      FROM ORG
      WHERE System_Status = 'N'
    )
    
    -- Regional Directors
    , REGIONAL_DIRECTORS AS (
      SELECT
        Region AS OrgCode
        , Org_Unit
        , Region_Director_Resource AS ResourceId
        , Region_Director_Resource_Name AS ResourceName
        , Region_Director_Position_Description AS PositionDescription
        , CONCAT(Region, ', ', COALESCE(Region_Description, '')) AS OrgUnitWorksAt
        , 'Regional_Director_OrganizationHierarchy' AS EntityRoleCode
        , 'Region' AS HierarchyLevel
      FROM ORG_STRUCTURE
      WHERE Region IS NOT NULL 
        AND Region != ''
        AND Region_Director_Resource IS NOT NULL 
        AND Region_Director_Resource != ''
    )
    
    -- Regional Deputy Directors
    , REGIONAL_DEPUTY_DIRECTORS AS (
      SELECT
        Region AS OrgCode
        , Org_Unit
        , Region_Deputy_Director_Resource AS ResourceId
        , Region_Deputy_Director_Resource_Name AS ResourceName
        , Region_Deputy_Director_Position_Description AS PositionDescription
        , CONCAT(Region, ', ', COALESCE(Region_Description, '')) AS OrgUnitWorksAt
        , 'Regional_Deputy_Director_OrganizationHierarchy' AS EntityRoleCode
        , 'Region' AS HierarchyLevel
      FROM ORG_STRUCTURE
      WHERE Region IS NOT NULL 
        AND Region != ''
        AND Region_Deputy_Director_Resource IS NOT NULL 
        AND Region_Deputy_Director_Resource != ''
    )
    
    -- Hub Directors (MCO Directors)
    , HUB_DIRECTORS AS (
      SELECT
        Hub AS OrgCode
        , Org_Unit
        , Hub_Director_Resource AS ResourceId
        , Hub_Director_Resource_Name AS ResourceName
        , Hub_Director_Position_Description AS PositionDescription
        , CONCAT(Hub, ', ', COALESCE(Hub_Description, '')) AS OrgUnitWorksAt
        , 'MCO_Director_OrganizationHierarchy' AS EntityRoleCode
        , 'Hub' AS HierarchyLevel
      FROM ORG_STRUCTURE
      WHERE Hub IS NOT NULL 
        AND Hub != ''
        AND Hub_Director_Resource IS NOT NULL 
        AND Hub_Director_Resource != ''
    )
    
    -- Hub Deputy Directors (MCO Deputy Directors)
    , HUB_DEPUTY_DIRECTORS AS (
      SELECT
        Hub AS OrgCode
        , Org_Unit
        , Hub_Deputy_Director_Resource AS ResourceId
        , Hub_Deputy_Director_Resource_Name AS ResourceName
        , Hub_Deputy_Director_Position_Description AS PositionDescription
        , CONCAT(Hub, ', ', COALESCE(Hub_Description, '')) AS OrgUnitWorksAt
        , 'MCO_Deputy_Director_OrganizationHierarchy' AS EntityRoleCode
        , 'Hub' AS HierarchyLevel
      FROM ORG_STRUCTURE
      WHERE Hub IS NOT NULL 
        AND Hub != ''
        AND Hub_Deputy_Director_Resource IS NOT NULL 
        AND Hub_Deputy_Director_Resource != ''
    )
    
    -- OrgUnit Directors
    , ORGUNIT_DIRECTORS AS (
      SELECT
        Org_Unit AS OrgCode
        , Org_Unit
        , Org_Unit_Director_Resource AS ResourceId
        , Org_Unit_Director_Resource_Name AS ResourceName
        , Org_Unit_Director_Position_Description AS PositionDescription
        , CONCAT(Org_Unit, ', ', COALESCE(Org_Unit_Description, '')) AS OrgUnitWorksAt
        , 'OrgUnit_Director_OrganizationHierarchy' AS EntityRoleCode
        , 'OrgUnit' AS HierarchyLevel
      FROM ORG_STRUCTURE
      WHERE Org_Unit IS NOT NULL 
        AND Org_Unit != ''
        AND Org_Unit_Director_Resource IS NOT NULL 
        AND Org_Unit_Director_Resource != ''
    )
    
    -- OrgUnit Deputy Directors
    , ORGUNIT_DEPUTY_DIRECTORS AS (
      SELECT
        Org_Unit AS OrgCode
        , Org_Unit
        , Org_Unit_Deputy_Director_Resource AS ResourceId
        , Org_Unit_Deputy_Director_Resource_Name AS ResourceName
        , Org_Unit_Deputy_Director_Position_Description AS PositionDescription
        , CONCAT(Org_Unit, ', ', COALESCE(Org_Unit_Description, '')) AS OrgUnitWorksAt
        , 'OrgUnit_Deputy_Director_OrganizationHierarchy' AS EntityRoleCode
        , 'OrgUnit' AS HierarchyLevel
      FROM ORG_STRUCTURE
      WHERE Org_Unit IS NOT NULL 
        AND Org_Unit != ''
        AND Org_Unit_Deputy_Director_Resource IS NOT NULL 
        AND Org_Unit_Deputy_Director_Resource != ''
    )
    
    -- OrgUnit HoSS (Head of Support Services) from unops-fabric.erp.afxurfpapprover
    , ORGUNIT_HOSS AS (
      SELECT
        o.Org_Unit AS OrgCode,
        o.Org_Unit,
        h.ResourceId,
        COALESCE(ps.ResourceName, h.ResourceId) AS ResourceName,
        'HoSS' AS PositionDescription,
        CONCAT(o.Org_Unit, ', ', COALESCE(o.Org_Unit_Description, '')) AS OrgUnitWorksAt,
        'HoSS_OrganizationHierarchy' AS EntityRoleCode,
        'OrgUnit' AS HierarchyLevel
      FROM (
        SELECT h.dim_value AS Org_Unit, h.user_fx AS ResourceId
        FROM `unops-fabric.erp.afxurfpapprover` h
        WHERE h.attribute_id = 'C1'
          AND h.title_fx = 'HoSS'
          AND h.user_fx IS NOT NULL AND TRIM(h.user_fx) != ''
          AND (
            SAFE_CAST(h.date_from AS DATE) = DATE('1900-01-01')
            OR SAFE_CAST(h.date_to AS DATE) = DATE('1900-01-01')
            OR h.date_from IS NULL OR h.date_to IS NULL
            OR CURRENT_DATE() BETWEEN SAFE_CAST(h.date_from AS DATE) AND SAFE_CAST(h.date_to AS DATE)
          )
      ) h
      INNER JOIN (
        SELECT Org_Unit, Org_Unit_Description
        FROM ORG
        WHERE System_Status = 'N' AND Org_Unit > '' AND (Hub > '' OR Region > '')
      ) o ON o.Org_Unit = h.Org_Unit
      LEFT JOIN (
        SELECT Resource,
          TRIM(REGEXP_REPLACE(CONCAT(COALESCE(First_Name, ''), ' ', COALESCE(Middle_Name, ''), ' ', COALESCE(Surname, '')), r'  +', ' ')) AS ResourceName
        FROM `unopsreporting.Employment.People_Search_Report`
        WHERE Effective_Date = CURRENT_DATE()
        QUALIFY ROW_NUMBER() OVER (PARTITION BY Resource ORDER BY Resource) = 1
      ) ps ON CAST(ps.Resource AS STRING) = CAST(h.ResourceId AS STRING)
      WHERE o.Org_Unit IS NOT NULL AND o.Org_Unit != ''
    )
    
    -- HSSE Regional Specialist, HSSE Regional Specialist OiC from unops-fabric.erp.aunops_orgstructure_roles (HoP excluded — AC9 / OfficeMaster)
    , ERP_ORG_STRUCTURE AS (
      SELECT Org_Unit, Org_Unit_Description, Region, Region_Description, Hub, Hub_Description
      FROM ORG
      WHERE System_Status = 'N' AND Org_Unit > '' AND (Hub > '' OR Region > '')
    )
    , ORGSTRUCTURE_ROLES_ERP AS (
      SELECT r.org_struct_lvl_value, r.org_struct_lvl_attribute_id, r.role, r.resource_id
      FROM `unops-fabric.erp.aunops_orgstructure_roles` r
      WHERE r.client = 'OPS'
        AND r.org_struct_lvl_attribute_id IN ('U287', 'C1')
        AND r.role IN ('HSSEREGIONALSPECIALIST1', 'HSSEREGIONALSPECIALIST2')
        AND r.resource_id IS NOT NULL AND TRIM(r.resource_id) != ''
        AND (SAFE_CAST(r.SysEndTime AS TIMESTAMP) = TIMESTAMP('1970-01-01 00:00:00 UTC') OR r.SysEndTime IS NULL)
    )
    , ERP_ROLES_U287 AS (
      SELECT
        r.org_struct_lvl_value AS OrgCode,
        o.Org_Unit,
        r.resource_id AS ResourceId,
        CASE r.role
          WHEN 'HSSEREGIONALSPECIALIST1' THEN 'HSSE_Regional_Specialist_OrganizationHierarchy'
          WHEN 'HSSEREGIONALSPECIALIST2' THEN 'HSSE_Regional_Specialist_OiC_OrganizationHierarchy'
        END AS EntityRoleCode,
        CASE WHEN o.Region = r.org_struct_lvl_value THEN 'Region' ELSE 'Hub' END AS HierarchyLevel,
        CASE
          WHEN o.Region = r.org_struct_lvl_value THEN CONCAT(r.org_struct_lvl_value, ', ', COALESCE(o.Region_Description, ''))
          ELSE CONCAT(r.org_struct_lvl_value, ', ', COALESCE(o.Hub_Description, ''))
        END AS OrgUnitWorksAt
      FROM ORGSTRUCTURE_ROLES_ERP r
      INNER JOIN ERP_ORG_STRUCTURE o ON (o.Region = r.org_struct_lvl_value OR o.Hub = r.org_struct_lvl_value)
      WHERE r.org_struct_lvl_attribute_id = 'U287'
    )
    , ERP_ROLES_C1 AS (
      SELECT
        r.org_struct_lvl_value AS OrgCode,
        r.org_struct_lvl_value AS Org_Unit,
        r.resource_id AS ResourceId,
        CASE r.role
          WHEN 'HSSEREGIONALSPECIALIST1' THEN 'HSSE_Regional_Specialist_OrganizationHierarchy'
          WHEN 'HSSEREGIONALSPECIALIST2' THEN 'HSSE_Regional_Specialist_OiC_OrganizationHierarchy'
        END AS EntityRoleCode,
        'OrgUnit' AS HierarchyLevel,
        CONCAT(r.org_struct_lvl_value, ', ', COALESCE(o.Org_Unit_Description, '')) AS OrgUnitWorksAt
      FROM ORGSTRUCTURE_ROLES_ERP r
      INNER JOIN ERP_ORG_STRUCTURE o ON o.Org_Unit = r.org_struct_lvl_value
      WHERE r.org_struct_lvl_attribute_id = 'C1'
    )
    , ERP_ROLES_COMBINED AS (
      SELECT OrgCode, Org_Unit, ResourceId, EntityRoleCode, HierarchyLevel, OrgUnitWorksAt FROM ERP_ROLES_U287
      UNION ALL
      SELECT OrgCode, Org_Unit, ResourceId, EntityRoleCode, HierarchyLevel, OrgUnitWorksAt FROM ERP_ROLES_C1
    )
    , ERP_ROLES_ORGSTRUCTURE AS (
      SELECT
        base.OrgCode,
        base.Org_Unit,
        base.ResourceId,
        COALESCE(ps.ResourceName, base.ResourceId) AS ResourceName,
        REPLACE(REPLACE(base.EntityRoleCode,
          'HSSE_Regional_Specialist_OrganizationHierarchy', 'HSSE Regional Specialist'),
          'HSSE_Regional_Specialist_OiC_OrganizationHierarchy', 'HSSE Regional Specialist OiC') AS PositionDescription,
        base.OrgUnitWorksAt,
        base.EntityRoleCode,
        base.HierarchyLevel
      FROM ERP_ROLES_COMBINED base
      LEFT JOIN (
        SELECT Resource,
          TRIM(REGEXP_REPLACE(CONCAT(COALESCE(First_Name, ''), ' ', COALESCE(Middle_Name, ''), ' ', COALESCE(Surname, '')), r'  +', ' ')) AS ResourceName
        FROM `unopsreporting.Employment.People_Search_Report`
        WHERE Effective_Date = CURRENT_DATE()
        QUALIFY ROW_NUMBER() OVER (PARTITION BY Resource ORDER BY Resource) = 1
      ) ps ON CAST(ps.Resource AS STRING) = CAST(base.ResourceId AS STRING)
    )
    
    -- Combine all director/deputy, HoSS, and ERP HSSE regional specialist roles (no HSSE Coordinator / HoP — OfficeMaster)
    , ALL_DIRECTORS_RAW AS (
      SELECT * FROM REGIONAL_DIRECTORS
      UNION ALL
      SELECT * FROM REGIONAL_DEPUTY_DIRECTORS
      UNION ALL
      SELECT * FROM HUB_DIRECTORS
      UNION ALL
      SELECT * FROM HUB_DEPUTY_DIRECTORS
      UNION ALL
      SELECT * FROM ORGUNIT_DIRECTORS
      UNION ALL
      SELECT * FROM ORGUNIT_DEPUTY_DIRECTORS
      UNION ALL
      SELECT * FROM ORGUNIT_HOSS
      UNION ALL
      SELECT * FROM ERP_ROLES_ORGSTRUCTURE
    )
    -- Filter to only org units that exist in OrganizationHierarchies (avoids EntityId FK lookup failures)
    , ALL_DIRECTORS AS (
      SELECT d.*
      FROM ALL_DIRECTORS_RAW d
      INNER JOIN VALID_ORG_UNITS v ON v.Code = d.Org_Unit
    )
    
    -- Generate final dataset with IDs and standard fields
    -- CRITICAL: Id MUST include Org_Unit to avoid duplicate Ids when one director manages multiple org units.
    -- Without Org_Unit, Regional/Hub directors with multiple org units would overwrite each other with wrong EntityId.
    SELECT DISTINCT
      -- Unique ID per (OrgCode, EntityRoleCode, ResourceId, Org_Unit) - one row per org unit assignment
      CAST(MOD(ABS(FARM_FINGERPRINT(CONCAT(
        CAST(d.OrgCode AS STRING), 
        '-', 
        d.EntityRoleCode,
        '-',
        d.ResourceId,
        '-',
        CAST(d.Org_Unit AS STRING)
      ))), 2147483647) AS INT64) AS Id  
      , CAST(MOD(ABS(FARM_FINGERPRINT(d.Org_Unit)), 2147483647) AS INT64) AS EntityId
      , 'OrganizationHierarchy' AS EntityType
      
      -- Map UserId from ResourceId (employee ID) - ensure it's INT64
      , CAST(PARSE_NUMERIC(d.ResourceId) AS INT64) AS UserId
      
      -- EntityRoleCode for lookup (e.g., Regional_Director_OrganizationHierarchy)
      , d.EntityRoleCode
      
      -- Standard fields
      , CONCAT(
          REPLACE(d.EntityRoleCode, '_OrganizationHierarchy', ''),
          ' - ', d.OrgCode, 
          ' - ', d.ResourceId,
          ' (', d.ResourceName, ')'
        ) AS Name
      , CAST(1 AS INT64) AS Status  -- Active
      , CAST(0 AS INT64) AS CreatedBy
      , CURRENT_TIMESTAMP() AS CreatedDate
      , CAST(0 AS INT64) AS LastModifiedBy
      , CURRENT_TIMESTAMP() AS LastModifiedDate  -- Always update to track sync time
      , FALSE AS IsDeleted
      , CAST(0 AS INT64) AS DeletedBy
      , CAST(NULL AS TIMESTAMP) AS DeletedDate
      , CAST(0 AS INT64) AS WorkflowStatus
      , 'Mgmt' AS RoleSource
      
      -- Operational Roles AC: Role type, Personnel name, Standardised Position Title, Org Unit Works At
      , d.OrgCode
      , d.Org_Unit
      , d.ResourceId
      , d.ResourceName
      , d.PositionDescription AS PositionTitle
      , COALESCE(NULLIF(TRIM(pw.Org_Unit_Work_At), ''), d.OrgUnitWorksAt) AS OrgUnitWorksAt
      , d.HierarchyLevel
    FROM
      ALL_DIRECTORS d
    LEFT JOIN PEOPLE_WORK_AT pw ON CAST(PARSE_NUMERIC(d.ResourceId) AS INT64) = pw.ResourceNum
    ORDER BY
      d.HierarchyLevel, d.OrgCode, d.EntityRoleCode
  
  primary_key_field: "Id"
  batch_size: 1000

  # Filter by RoleSource so orphan handling only considers Mgmt records (not DoA)
  filter:
    field: "RoleSource"
    value: "Mgmt"

destination:
  table_name: "EntityUserRoles"
  schema: "public"
  manage_table_structure: false  # Allow updates to standard fields
  add_standard_fields: false
  
  field_mappings:
    - source_field: "Id"
      destination_field: "Id"
      data_type: "integer"
      is_unique: true
      is_required: true
    
    # EntityId - handled via foreign_key_mappings (lookup from OrganizationHierarchies)
    
    - source_field: "EntityType"
      destination_field: "EntityType"
      data_type: "varchar(50)"
      is_required: true
    
    # UserId - handled via foreign_key_mappings (validates & maps)
    
    - source_field: "Name"
      destination_field: "Name"
      data_type: "varchar(500)"
      is_required: false
    
    - source_field: "Status"
      destination_field: "Status"
      data_type: "integer"
      is_required: true
    
    - source_field: "CreatedBy"
      destination_field: "CreatedBy"
      data_type: "integer"
      is_required: true
      insert_only: true  # Preserve original creator on updates
    
    - source_field: "CreatedDate"
      destination_field: "CreatedDate"
      data_type: "timestamp"
      is_required: true
      insert_only: true  # Preserve original creation time
    
    - source_field: "LastModifiedBy"
      destination_field: "LastModifiedBy"
      data_type: "integer"
      is_required: true
    
    - source_field: "LastModifiedDate"
      destination_field: "LastModifiedDate"
      data_type: "timestamp"
      is_required: true
    
    - source_field: "IsDeleted"
      destination_field: "IsDeleted"
      data_type: "boolean"
      is_required: true
    
    - source_field: "DeletedBy"
      destination_field: "DeletedBy"
      data_type: "integer"
      is_required: false
    
    - source_field: "DeletedDate"
      destination_field: "DeletedDate"
      data_type: "timestamp"
      is_required: false
    
    - source_field: "WorkflowStatus"
      destination_field: "WorkflowStatus"
      data_type: "integer"
      is_required: true
    
    - source_field: "RoleSource"
      destination_field: "RoleSource"
      data_type: "varchar(50)"
      is_required: true
    
    # Operational Roles AC: People_Search Position_Description, else org-structure / role label
    - source_field: "PositionTitle"
      destination_field: "PositionTitle"
      data_type: "varchar(255)"
      is_required: false
    
    # Operational Roles AC: Org unit where holder works (Region/Hub/OrgUnit + description)
    - source_field: "OrgUnitWorksAt"
      destination_field: "OrgUnitWorksAt"
      data_type: "varchar(255)"
      is_required: false
  
  # Mark orphaned Mgmt records (in DB but not in BigQuery) as IsDeleted=true
  delete_handler:
    field: "IsDeleted"
    value: true

  # Foreign key lookups - resolves IDs from lookup tables
  foreign_key_mappings:
    # Lookup EntityId from OrganizationHierarchies using Org_Unit code
    # Org_Unit is present for all role levels (Regional, Hub, OrgUnit) - links to specific org unit
    - source_field: "Org_Unit"
      lookup_table: "OrganizationHierarchies"
      lookup_field: "Code"
      destination_field: "EntityId"
      lookup_return_field: "Id"
      is_required: true
      on_lookup_fail: "LogWarning"
    
    # Lookup EntityRoleId from EntityRoles using EntityRoleCode
    # This transforms EntityRoleCode (text) into EntityRoleId (integer)
    - source_field: "EntityRoleCode"
      lookup_table: "EntityRoles"
      lookup_field: "Code"
      destination_field: "EntityRoleId"
      lookup_return_field: "Id"
      is_required: true
      on_lookup_fail: "LogWarning"
    
    # Validate UserId exists in AspNetUsers - skip record if user is missing
    - source_field: "UserId"
      lookup_table: "AspNetUsers"
      lookup_field: "Id"
      destination_field: "UserId"
      lookup_return_field: "Id"
      is_required: false
      on_lookup_fail: "LogWarning"

sync_options:
  sync_mode: Upsert  # Insert new or update ALL existing records
  batch_processing: true
  use_bulk_upsert: true  # Uses Id (PK); no additional index needed
  delete_orphaned_records: true  # Mark Mgmt records not in BigQuery as IsDeleted=true
  # Note: Updates all records on every sync to ensure latest data
  # Use CreatedDate vs LastModifiedDate to distinguish inserts from updates
  # Upsert matching: Uses primary_key_field "Id" defined in source section

validation:
  required_source_fields:
    - "Id"
    - "Org_Unit"   # Used for EntityId FK lookup from OrganizationHierarchies
    - "EntityType"
    - "UserId"
    - "EntityRoleCode"
  
  # Validate role codes are one of the expected management roles
  custom_validations:
    - field: "EntityRoleCode"
      rule: "in_list"
      allowed_values: 
        - "Regional_Director_OrganizationHierarchy"
        - "Regional_Deputy_Director_OrganizationHierarchy"
        - "MCO_Director_OrganizationHierarchy"
        - "MCO_Deputy_Director_OrganizationHierarchy"
        - "OrgUnit_Director_OrganizationHierarchy"
        - "OrgUnit_Deputy_Director_OrganizationHierarchy"
        - "HoSS_OrganizationHierarchy"
        - "HSSE_Regional_Specialist_OrganizationHierarchy"
        - "HSSE_Regional_Specialist_OiC_OrganizationHierarchy"
      error_message: "EntityRoleCode must be a valid management role"
  
error_handling:
  on_connection_error: RetryWithBackoff
  on_mapping_error: SkipRecord
  on_lookup_failure: SkipRecord
  log_skipped_records: true

logging:
  log_level: "Debug"
  log_sql_queries: true
  log_record_details: false

notes: |
  # Management Roles Sync Configuration
  
  ## Purpose
  Synchronizes organizational management roles (Directors and Deputy Directors) from BigQuery 
  Organisational_Structures table into the EntityUserRoles table. This replaces the 
  OrgUnitDirectorRolesSeeder.cs static seeder with a dynamic, BigQuery-driven sync.
  
  ## Role Hierarchy
  **Not synced here (OfficeMaster / Opportunity+):** `Organizational_HSSE_Coordinator_*`, Head of Programme (AC9).
  
  1. **Regional Roles** (Region level)
     - Regional_Director_OrganizationHierarchy
     - Regional_Deputy_Director_OrganizationHierarchy
     - HSSE_Regional_Specialist, HSSE_Regional_Specialist_OiC (from ERP aunops_orgstructure_roles, U287)
  
  2. **Hub Roles** (MCO = Multi-Country Office level)
     - MCO_Director_OrganizationHierarchy
     - MCO_Deputy_Director_OrganizationHierarchy
     - HSSE_Regional_Specialist, HSSE_Regional_Specialist_OiC (from ERP aunops_orgstructure_roles, U287)
  
  3. **OrgUnit Roles** (Organizational Unit level)
     - OrgUnit_Director_OrganizationHierarchy
     - OrgUnit_Deputy_Director_OrganizationHierarchy
     - HoSS_OrganizationHierarchy (from ERP afxurfpapprover)
     - HSSE_Regional_Specialist_OrganizationHierarchy (from ERP aunops_orgstructure_roles)
     - HSSE_Regional_Specialist_OiC_OrganizationHierarchy (from ERP aunops_orgstructure_roles)
  
  ## Data Flow
  1. Extract from `unopsreporting.Organisation.Organisational_Structures` (directors, deputies only)
  2. Extract HoSS from `unops-fabric.erp.afxurfpapprover` (inline in query)
  3. Extract HSSE Regional Specialist roles from `unops-fabric.erp.aunops_orgstructure_roles` (HEADOFPROGRAMS excluded)
  4. UNPIVOT director/deputy columns into individual role assignments
  5. Generate deterministic IDs using FARM_FINGERPRINT(OrgCode + EntityRoleCode + ResourceId + Org_Unit)
  6. Map Org_Unit to EntityId via OrganizationHierarchies lookup (destination)
  7. Map ResourceId (employee ID) to UserId (integer)
  8. Lookup EntityRoleId from EntityRoles table using EntityRoleCode
  9. Upsert into EntityUserRoles table (RoleSource=Mgmt)
  
  ## BQ Field Mapping (Operational Roles AC) — aligned with EntityUserRole
  | BQ Column | EntityUserRole | Notes |
  |----------|----------------|-------|
  | People_Search_PositionDescription | PositionTitle (primary) | `Position_Description` from Employment.People_Search_Report |
  | *_Position_Description | PositionTitle (fallback) | Region/Hub/OrgUnit Director/Deputy when People Search empty |
  | OrgCode + *_Description | OrgUnitWorksAt | CONCAT(OrgCode, ', ', Description) per hierarchy level |
  | ResourceId | UserId | Employee ID (parsed to INT64) |
  | ResourceName | (via User) | Personnel name |
  | EntityRoleCode | EntityRoleId | Lookup via EntityRoles table |
  | Org_Unit | EntityId | Lookup via OrganizationHierarchies |
  
  ## Key Fields
  - **Id**: Generated hash of (OrgCode + EntityRoleCode + ResourceId + Org_Unit) for stable primary key
  - **EntityId**: Lookup from OrganizationHierarchies using Org_Unit code
  - **UserId**: Employee ID from ResourceId (matches AspNetUsers.Id)
  - **EntityRoleId**: Looked up from EntityRoles table using EntityRoleCode
  - **EntityType**: Always 'OrganizationHierarchy' for organizational management roles
  - **PositionTitle**: `People_Search_Report.Position_Description` when non-empty; else `*_Position_Description` / HoSS / ERP role label
  
  ## Sync Behavior
  - **Upsert mode**: Inserts new roles and updates existing ones on every sync
  - **Update tracking**: LastModifiedDate always set to sync time
  - **Creation tracking**: CreatedDate preserved from first insert (insert_only: true)
  - **Orphan handling**: Mgmt rows no longer returned by BigQuery are soft-deleted (IsDeleted=true) when delete_orphaned_records is enabled
  
  ## Prerequisites
  1. **AspNetUsers** must be synced first (provides valid UserIds)
  2. **OrganizationHierarchies** must be synced first (provides valid EntityIds)
  3. **EntityRoles** must contain the nine Mgmt role codes used by this sync (directors/deputies, HoSS, two HSSE regional specialist codes)
  
  ## Validation
  - Checks that all required source fields are present
  - Validates EntityRoleCode is one of the nine allowed Mgmt role codes
  - Skips records if EntityRole lookup fails
  - Logs warnings for failed lookups
  
  ## Monitoring
  - Check SyncExecutionLogs for sync status
  - Review logs for skipped records (missing users/orgs/roles)
  - Compare record counts: BigQuery source vs PostgreSQL destination
  
  ## Related Configurations
  - entity-user-roles-doa.yaml: DoA (Delegation of Authority) roles
  - organization-hierarchies.yaml: Organization structure (provides EntityIds)
  - aspnetusers.yaml: User accounts (provides UserIds)
  
  ## Troubleshooting
  
  ### Skipped Records
  If records are skipped during sync, check:
  1. **Missing EntityRole**: Does EntityRoles table contain all required Mgmt role codes for this sync?
  2. **Missing User**: Does AspNetUsers contain the ResourceId as UserId?
  3. **Missing OrgUnit**: Does OrganizationHierarchies contain the OrgCode with matching EntityId?
  
  Query to check missing lookups:
  ```sql
  -- Check which management roles exist
  SELECT "Code", "Id" FROM "EntityRoles" 
  WHERE "Code" LIKE '%Director%OrganizationHierarchy' 
  ORDER BY "Code";
  
  -- Check if users exist
  SELECT COUNT(*) FROM "AspNetUsers" WHERE "Id" IN (201247, 155212);
  
  -- Check if org codes exist
  SELECT "Code", "Id" FROM "OrganizationHierarchies" 
  WHERE "Code" IN ('CRP', 'B0048')
  ORDER BY "Code";
  ```
  
  ### Duplicate Detection
  If duplicates are created:
  ```sql
  -- Check for duplicate (EntityId, EntityRoleId, UserId) combinations
  SELECT 
      "EntityId", "EntityRoleId", "UserId", COUNT(*) AS "Duplicates"
  FROM "EntityUserRoles"
  WHERE "EntityType" = 'OrganizationHierarchy'
  GROUP BY "EntityId", "EntityRoleId", "UserId"
  HAVING COUNT(*) > 1;
  ```
  
  ### Verify Sync Results
  ```sql
  -- Count by role type
  SELECT 
      er."Code" AS "RoleCode",
      COUNT(*) AS "AssignmentCount"
  FROM "EntityUserRoles" eur
  INNER JOIN "EntityRoles" er ON eur."EntityRoleId" = er."Id"
  WHERE eur."EntityType" = 'OrganizationHierarchy'
      AND er."Code" LIKE '%Director%OrganizationHierarchy'
  GROUP BY er."Code"
  ORDER BY er."Code";
  
  -- Recent syncs
  SELECT 
      COUNT(*) AS "TotalManagementRoles",
      MAX("LastModifiedDate") AS "LastSyncTime"
  FROM "EntityUserRoles" eur
  INNER JOIN "EntityRoles" er ON eur."EntityRoleId" = er."Id"
  WHERE eur."EntityType" = 'OrganizationHierarchy'
      AND er."Code" LIKE '%Director%OrganizationHierarchy';
  ```