metadata:
  name: "offices"
  description: "Office (P3M organizational units) sync from Organisational_Structures + NER/EA targets from Corporate_Performance_Report"
  version: "1.5"
  enabled: true
  max_retry_attempts: 1
  timeout_minutes: 5

source:
  type: "bigquery"

  query: |
    WITH ORG AS (
      SELECT *
      FROM `unopsreporting.Organisation.Organisational_Structures`
      WHERE CAST(Effective_Date AS DATE) = CURRENT_DATE()
    )
    , PERF AS (
      SELECT
        Org_Unit
        , SUM(SAFE_CAST(NER_Target_Amount AS NUMERIC)) AS NER_Target_Amount
        , SUM(SAFE_CAST(EA_Target_Amount AS NUMERIC)) AS EA_Target_Amount
        , MAX(Fiscal_Year) AS Fiscal_Year
      FROM `unopsreporting.Corporate_Performance.Corporate_Performance_Report`
      WHERE CAST(Fiscal_Year AS INT64) = EXTRACT(YEAR FROM CURRENT_DATE())
      GROUP BY Org_Unit
    )
    SELECT
      (CASE WHEN o.Org_Unit > '' THEN MOD(ABS(FARM_FINGERPRINT(o.Org_Unit)), 2147483647) ELSE 1 END) AS Id
      , o.Org_Unit AS Code
      , (CASE WHEN o.Org_Unit > '' THEN MOD(ABS(FARM_FINGERPRINT(o.Org_Unit)), 2147483647) ELSE 1 END) AS OrganizationHierarchyId
      , CONCAT(COALESCE(o.Region, ''), ' ', COALESCE(o.Hub, ''), ' ', o.Org_Unit, ' ', COALESCE(o.Org_Unit_Description, '')) AS InternalName
      , o.Org_Unit_Description AS ExternalName
      , CAST(o.Effective_Date AS TIMESTAMP) AS EffectiveDate
      , o.Org_Unit AS CostCentreId
      , SAFE_CAST(p.NER_Target_Amount AS NUMERIC) AS NerTarget
      , CAST(p.Fiscal_Year AS STRING) AS NerTargetPeriod
      , SAFE_CAST(p.EA_Target_Amount AS NUMERIC) AS EaTarget
      , CAST(p.Fiscal_Year AS STRING) AS EaTargetPeriod
      , CONCAT(o.Org_Unit, ' ', COALESCE(o.Org_Unit_Description, '')) AS Name
      , (CASE WHEN o.System_Status = 'N' THEN 1 ELSE 0 END) AS Status
      , FALSE AS IsDeleted
    FROM ORG o
    LEFT JOIN PERF p ON p.Org_Unit = o.Org_Unit
    WHERE o.Org_Unit > ''
      AND o.System_Status = 'N'
    QUALIFY ROW_NUMBER() OVER (PARTITION BY o.Org_Unit ORDER BY o.Org_Unit) = 1
    ORDER BY Code
    ;

  primary_key_field: "Id"
  batch_size: 1000

destination:
  table_name: "Offices"
  schema: "public"
  manage_table_structure: false
  add_standard_fields: false

  field_mappings:
    - source_field: "Id"
      destination_field: "Id"
      data_type: "integer"
      is_unique: true
      is_required: true

    - source_field: "Code"
      destination_field: "Code"
      data_type: "varchar(50)"
      is_required: true

    - source_field: "OrganizationHierarchyId"
      destination_field: "OrganizationHierarchyId"
      data_type: "integer"
      is_required: false

    - source_field: "InternalName"
      destination_field: "InternalName"
      data_type: "varchar(500)"
      is_required: false

    - source_field: "ExternalName"
      destination_field: "ExternalName"
      data_type: "varchar(255)"
      is_required: false

    - source_field: "EffectiveDate"
      destination_field: "EffectiveDate"
      data_type: "timestamp"
      is_required: false

    - source_field: "CostCentreId"
      destination_field: "CostCentreId"
      data_type: "varchar(50)"
      is_required: false

    - source_field: "NerTarget"
      destination_field: "NerTarget"
      data_type: "numeric"
      is_required: false

    - source_field: "NerTargetPeriod"
      destination_field: "NerTargetPeriod"
      data_type: "varchar(20)"
      is_required: false

    - source_field: "EaTarget"
      destination_field: "EaTarget"
      data_type: "numeric"
      is_required: false

    - source_field: "EaTargetPeriod"
      destination_field: "EaTargetPeriod"
      data_type: "varchar(20)"
      is_required: false

    - source_field: "Name"
      destination_field: "Name"
      data_type: "text"
      is_required: true

    - source_field: "Status"
      destination_field: "Status"
      data_type: "integer"
      is_required: false

    - source_field: "IsDeleted"
      destination_field: "IsDeleted"
      data_type: "boolean"
      is_required: false

  # Do NOT mark orphaned offices as inactive or deleted - keep all synced offices as-is.

sync_options:
  sync_mode: Upsert
  batch_processing: true
  use_bulk_upsert: true
  delete_orphaned_records: false  # Offices not in BQ result remain unchanged (never mark IsDeleted/Status)

validation:
  required_source_fields:
    - "Id"
    - "Code"
    - "EffectiveDate"
    - "Name"

error_handling:
  on_connection_error: RetryWithBackoff
  on_mapping_error: SkipRecord

logging:
  log_level: "Debug"
  log_sql_queries: true
  log_record_details: true

notes: |
  Syncs offices with System_Status = 'N' from Organisational_Structures. Id = FARM_FINGERPRINT(Org_Unit) when Org_Unit non-empty, else 1.
  Ensures every Office has valid OrganizationHierarchyId (FK). NER/EA targets from Corporate_Performance (summed for current FY).
  Alias is not in this sync (column untouched by upsert); populate via OfficeMasterDataSeeder from MASTER sheet.
  B0061 and B0062 do not come from ERP; they are created by OfficeMasterDataSeeder from MASTER data.
