metadata:
  name: "locations"
  description: "Location (physical office details) sync from Locations.Location - depends on offices"
  version: "1.0"
  enabled: true
  max_retry_attempts: 1
  timeout_minutes: 5

source:
  type: "bigquery"

  query: |
    WITH VALID_ORG AS (
      SELECT Org_Unit
      FROM `unopsreporting.Organisation.Organisational_Structures`
      WHERE CAST(Effective_Date AS DATE) = CURRENT_DATE()
        AND Org_Unit > ''
        AND (Hub > '' OR Region > '')
    )
    SELECT
      MOD(ABS(FARM_FINGERPRINT(l.Location)), 2147483647) AS Id
      , l.Location AS Code
      , MOD(ABS(FARM_FINGERPRINT(l.Location_Parent_Entity)), 2147483647) AS OfficeId
      , COALESCE(l.Location_Name, l.Location) AS Name
      , l.Location_Alias AS Alias
      , l.Location_Description AS Description
      , l.Location_Type AS LocationType
      , l.Location_Address_Line AS AddressLine
      , l.Location_Postal_Code AS PostalCode
      , l.Location_City AS City
      , l.Location_State AS State
      , l.Location_Country AS CountryCode
      , l.Location_Country_Name AS CountryName
      , (SELECT SAFE_CAST(coord.Coordinate_Latitude AS FLOAT64)
         FROM UNNEST(l.Location_Coordinates) AS coord
         ORDER BY SAFE_CAST(coord.Coordinate_Order AS INT64)
         LIMIT 1) AS PrimaryLatitude
      , (SELECT SAFE_CAST(coord.Coordinate_Longitude AS FLOAT64)
         FROM UNNEST(l.Location_Coordinates) AS coord
         ORDER BY SAFE_CAST(coord.Coordinate_Order AS INT64)
         LIMIT 1) AS PrimaryLongitude
      , TO_JSON_STRING(l.Location_Coordinates) AS CoordinatesJson
      , l.Location_Coordinator AS LocationCoordinatorId
      , l.Location_GUID AS LocationGuid
      , (CASE WHEN l.Location_Status = 'N' THEN 1 ELSE 3 END) AS Status
      , FALSE AS IsDeleted
    FROM `unopsreporting.Locations.Location` l
    INNER JOIN VALID_ORG v ON v.Org_Unit = l.Location_Parent_Entity
    WHERE l.Location_Type = 'ORGUNIT_OFFICE'
      AND l.Location_Latest_Flag = 'YES'
      AND l.Location_Status = 'N'
    QUALIFY ROW_NUMBER() OVER (PARTITION BY l.Location ORDER BY l.Location) = 1
    ORDER BY Code
    ;

  primary_key_field: "Id"
  batch_size: 1000

destination:
  table_name: "Locations"
  schema: "public"
  manage_table_structure: false
  add_standard_fields: false

  field_mappings:
    - source_field: "Id"
      destination_field: "Id"
      data_type: "integer"
      is_unique: true
      is_required: true

    - source_field: "Code"
      destination_field: "Code"
      data_type: "varchar(50)"
      is_required: true

    - source_field: "OfficeId"
      destination_field: "OfficeId"
      data_type: "integer"
      is_required: true

    - source_field: "Name"
      destination_field: "Name"
      data_type: "varchar(500)"
      is_required: true

    - source_field: "Alias"
      destination_field: "Alias"
      data_type: "varchar(255)"
      is_required: false

    - source_field: "Description"
      destination_field: "Description"
      data_type: "text"
      is_required: false

    - source_field: "LocationType"
      destination_field: "LocationType"
      data_type: "varchar(50)"
      is_required: false

    - source_field: "AddressLine"
      destination_field: "AddressLine"
      data_type: "varchar(500)"
      is_required: false

    - source_field: "PostalCode"
      destination_field: "PostalCode"
      data_type: "varchar(20)"
      is_required: false

    - source_field: "City"
      destination_field: "City"
      data_type: "varchar(100)"
      is_required: false

    - source_field: "State"
      destination_field: "State"
      data_type: "varchar(100)"
      is_required: false

    - source_field: "CountryCode"
      destination_field: "CountryCode"
      data_type: "varchar(10)"
      is_required: false

    - source_field: "CountryName"
      destination_field: "CountryName"
      data_type: "varchar(100)"
      is_required: false

    - source_field: "PrimaryLatitude"
      destination_field: "PrimaryLatitude"
      data_type: "numeric"
      is_required: false

    - source_field: "PrimaryLongitude"
      destination_field: "PrimaryLongitude"
      data_type: "numeric"
      is_required: false

    - source_field: "CoordinatesJson"
      destination_field: "CoordinatesJson"
      data_type: "jsonb"
      is_required: false

    - source_field: "LocationCoordinatorId"
      destination_field: "LocationCoordinatorId"
      data_type: "varchar(50)"
      is_required: false

    - source_field: "LocationGuid"
      destination_field: "LocationGuid"
      data_type: "varchar(50)"
      is_required: false

    - source_field: "Status"
      destination_field: "Status"
      data_type: "integer"
      is_required: false

    - source_field: "IsDeleted"
      destination_field: "IsDeleted"
      data_type: "boolean"
      is_required: false

  delete_handler:
    field: "IsDeleted"
    value: true

sync_options:
  sync_mode: Upsert
  batch_processing: true
  use_bulk_upsert: true
  delete_orphaned_records: true

validation:
  required_source_fields:
    - "Id"
    - "Code"
    - "OfficeId"
    - "Name"

error_handling:
  on_connection_error: RetryWithBackoff
  on_mapping_error: SkipRecord

logging:
  log_level: "Debug"
  log_sql_queries: true
  log_record_details: true

notes: |
  Depends on offices sync (Stage 5b). Joins to valid Org_Units from Organisational_Structures (same filter as offices).
  OfficeId = FARM_FINGERPRINT(Location_Parent_Entity). Only active locations (Location_Status = 'N').
  CoordinatesJson stores full array; PrimaryLatitude/PrimaryLongitude for map display.
