<div class="office-list-container flex flex-col gap-6 p-4">
  <!-- Page header -->
  <div class="flex items-center gap-4">
    <span class="material-symbols-outlined text-3xl text-blue-500">apartment</span>
    <h1 class="text-3xl font-bold text-gray-950">{{ 'office.list.title' | translate }}</h1>
  </div>

  @if (columnsLoading()) {
    <div class="flex items-center justify-center py-12">
      <p-progressSpinner strokeWidth="3" styleClass="w-10 h-10"></p-progressSpinner>
    </div>
  } @else {
    <app-listview
      [dataUrl]="'/api/office'"
      [entityType]="'Office'"
      [columns]="columns()"
      [config]="listviewConfig()"
      (rowClick)="onRowClick($event)"
      class="office-listview"
    >
    </app-listview>
  }
</div>
