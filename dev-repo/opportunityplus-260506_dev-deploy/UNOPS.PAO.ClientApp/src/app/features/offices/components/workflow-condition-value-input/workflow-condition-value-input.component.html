@if (usePicker()) {
  <div class="flex w-full items-center gap-2">
    <i
      class="pi pi-search shrink-0 text-sm text-gray-400"
      [attr.title]="'office.workflowConfig.editor.valueSearchableHint' | translate"
      [attr.aria-hidden]="true"></i>
    <div class="min-w-0 flex-1">
      @switch (pickerKind()) {
        @case ('partner') {
          <p-autocomplete
            class="w-full"
            styleClass="w-full"
            [inputStyleClass]="'w-full'"
            [ngModel]="selectedPartner()"
            (ngModelChange)="onPartnerSelect($event)"
            [suggestions]="partnerSuggestions()"
            (completeMethod)="onPartnerComplete($event)"
            optionLabel="name"
            [disabled]="disabled()"
            [forceSelection]="true"
            appendTo="body"
            [fluid]="true" />
        }
        @case ('user') {
          <p-autocomplete
            class="w-full"
            styleClass="w-full"
            [inputStyleClass]="'w-full'"
            [ngModel]="selectedUser()"
            (ngModelChange)="onUserSelect($event)"
            [suggestions]="userSuggestions()"
            (completeMethod)="onUserComplete($event)"
            optionLabel="name"
            [disabled]="disabled()"
            [forceSelection]="true"
            appendTo="body"
            [fluid]="true" />
        }
        @case ('contact') {
          <p-autocomplete
            class="w-full"
            styleClass="w-full"
            [inputStyleClass]="'w-full'"
            [ngModel]="selectedContact()"
            (ngModelChange)="onContactSelect($event)"
            [suggestions]="contactSuggestions()"
            (completeMethod)="onContactComplete($event)"
            optionLabel="label"
            [disabled]="disabled()"
            [forceSelection]="true"
            appendTo="body"
            [fluid]="true" />
        }
        @default {
          <p-select
            [options]="selectOptions()"
            optionLabel="label"
            optionValue="value"
            [ngModel]="valueText()"
            (ngModelChange)="valueText.set($event)"
            [filter]="true"
            filterBy="label"
            [disabled]="disabled()"
            [showClear]="true"
            appendTo="body"
            styleClass="w-full"
            [style]="{ width: '100%' }" />
        }
      }
    </div>
  </div>
} @else {
  <input
    pInputText
    class="w-full"
    [ngModel]="valueText()"
    (ngModelChange)="valueText.set($event)"
    [disabled]="disabled()" />
}
