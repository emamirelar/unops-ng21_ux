<div class="flex flex-col gap-8">
  <div class="flex flex-col items-center">
    <div class="w-full flex justify-between items-center">
      <div class="font-semibold text-gray-400">
        {{ 'title.contact' | translate }}
      </div>
      <app-go-back></app-go-back>
    </div>

    <div class="flex gap-2 md:gap-4 w-full items-center">
      <app-picture
        [imageUrl]="recordData.profilePictureUrl || ''"
        [uploadUrl]="getUploadProfilePictureUrl()"
        [altText]="'label.contact.profilePictureAlt' | translate"
        [size]="isMobile() ? 'extra-small' : 'small'"
        [entityType]="'Contact'"
        [disabled]="!recordData.permissions?.canUpdate"
        (imageChanged)="_loadRecordDetails()"
      />
      <div class="flex flex-col min-w-0">
        <div class="text-2xl md:text-4xl font-bold text-gray-950">
          {{ getContactDisplayName() }}
        </div>
        <div class="text-lg text-gray-600">
          {{ recordData.title }}
          @if (recordData.department) {
            - {{ recordData.department }}
          }
        </div>
        @if (recordData.partner?.name) {
          <div class="text-blue-500 font-semibold">
            {{ recordData.partner?.name }}
          </div>
        }
      </div>
    </div>
  </div>

  <div class="block md:hidden p-4 bg-white shadow-sm rounded-lg border border-gray-200">
    <p-select
      [options]="tabs"
      [ngModel]="getActiveTab()"
      (onChange)="onTabChange($event)"
      optionLabel="translatedLabel"
      [placeholder]="'placeholder.contact.selectTab' | translate"
      class="w-full"
    />
  </div>

  <div class="hidden md:block">
    <p-tabs [value]="activeRoute">
      <p-tablist>
        @for (tab of tabs; track tab.route) {
          <p-tab
            [value]="tab.route"
            [routerLink]="tab.route"
            class="contact-tabs__tab flex items-center !gap-2 text-inherit"
          >
            <span>{{ tab.label | translate }}</span>
          </p-tab>
        }
      </p-tablist>
    </p-tabs>
  </div>

  <div>
    <router-outlet></router-outlet>
  </div>
</div>
