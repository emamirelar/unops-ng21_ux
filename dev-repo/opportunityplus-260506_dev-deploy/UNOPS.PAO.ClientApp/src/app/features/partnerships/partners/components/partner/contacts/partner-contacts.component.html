<p-confirmDialog></p-confirmDialog>

<div class="flex flex-col gap-8">
  <div class="flex flex-wrap items-center gap-4">
    <div class="flex items-center gap-3 contact-section-header">
      <span class="material-symbols-outlined text-3xl text-blue-500">contacts</span>
      <p class="text-3xl font-bold text-gray-950">
        {{ 'title.contacts' | translate }}
        @if (partnerName()) {
          <span class="text-lg font-normal text-gray-600 ml-2">- {{ partnerName() }}</span>
        }
      </p>
    </div>
    <div class="ml-auto flex gap-2 flex-wrap">
      @if (entityPermissions().permissions.canCreate) {
      <p-button
        icon="pi pi-plus"
        [label]="'button.new' | translate"
        (onClick)="openContactEditDialog()"
        rounded
        class="contact-new-button"
      />
      }
    </div>
  </div>

  <app-listview
    #listviewComponent
    [dataUrl]="dataUrl()"
    [columns]="columns()"
    [config]="config()"
    [entityType]="'Contact'"
    (rowClick)="handleOnOpenRecordDetails($event)"
    class="contact-listview"
  >
  </app-listview>
</div>
