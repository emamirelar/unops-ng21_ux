<div class="relative">
  <p-button
    type="button"
    [rounded]="true"
    [text]="true"
    [ariaLabel]="'tour.control.takeATour' | translate"
    styleClass="tour-button flex items-center justify-center"
    [pTooltip]="'tour.control.takeATour' | translate"
    tooltipPosition="bottom"
    (click)="detectTour()">
    <ng-template pTemplate="content">
      <i class="pi pi-compass text-xl"></i>
    </ng-template>
  </p-button>
</div>
